version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    goconst:
      min-len: 2
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        # G204/G304: subprocess & file access with variable paths — LGH is a
        # local CLI/server whose core function is running git against
        # registered repo paths and writing files under ~/.localgithub.
        - G204
        - G304
    govet:
      enable:
        - shadow
    lll:
      line-length: 140
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - gosec
          - revive
        path: _test\.go
      - linters:
          - revive
        path: cmd/
        text: 'exported:'
      - linters:
          - revive
        path: internal/
        text: 'exported:'
      # "cancelled" is the wire-format job status shared with ActionD and
      # actiond-web — keep the British spelling (v2 misspell has no
      # ignore-words setting, so exclude by message text).
      - linters:
          - misspell
        text: '`cancelled` is a misspelling'
      # G702/G703 (taint-analysis variants of G204/G304, present in newer
      # golangci-lint releases) flag LGH's core pattern of running git on
      # registered repo paths. Excluded by text because older releases'
      # config schema rejects the rule IDs.
      - linters:
          - gosec
        text: 'G70[23]:'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/JoeGlenn1213/lgh
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
